<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Numbers Lab — Practice Sheet (Crislyn)</title>
  <meta name="theme-color" content="#F4A6BD" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%AC%3C/text%3E%3C/svg%3E" />
  <style>
    body { margin: 0; background: #FAF5FF; font-family: 'Nunito', system-ui, sans-serif; color: #1E1B4B; }
    .nlws-bar { position: sticky; top: 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 12px 18px; background: #fff; border-bottom: 1px solid #E9D5FF; z-index: 5; }
    .nlws-bar a, .nlws-bar button { font: inherit; font-weight: 700; border: 1px solid #E9D5FF; background: #F3E8FF; color: #1E1B4B; padding: 9px 16px; border-radius: 11px; cursor: pointer; text-decoration: none; }
    .nlws-bar .primary { background: linear-gradient(135deg, #F4A6BD, #6EC6F0); color: #fff; border: none; }
    .nlws-bar .sp { flex: 1; }
    .nlws-paper { background: #fff; max-width: 760px; margin: 22px auto; padding: 26px 30px; border-radius: 8px; box-shadow: 0 8px 28px rgba(107,33,168,.12); }
    .nlws-head h1 { font-family: 'Fredoka One', system-ui, sans-serif; font-size: 1.5rem; margin: 0 0 6px; }
    .nlws-head p { color: #6b21a8; margin: 0 0 8px; }
    .nlws-sec { margin-top: 18px; page-break-inside: avoid; }
    .nlws-sec h3 { font-size: 1.05rem; margin: 0 0 8px; padding: 6px 12px; background: #F3E8FF; border-left: 4px solid #F4A6BD; border-radius: 6px; }
    .nlws-sec ol { margin: 0; padding-left: 26px; }
    .nlws-sec li { margin: 9px 0; line-height: 1.7; }
    .nlws-grid { height: 64px; border: 1px dashed #d8b4fe; border-radius: 8px; margin: 6px 0 4px; }
    .nlws-ans u { text-decoration: none; background: #E7F7ED; border-radius: 4px; padding: 0 2px; }
    @media print {
      .nlws-bar { display: none; }
      body { background: #fff; }
      .nlws-paper { box-shadow: none; margin: 0 auto; max-width: 100%; border-radius: 0; }
      @page { size: A4; margin: 14mm; }
      .nlws-paper { page-break-after: always; }
      body.nlws-print-q #nlws-a { display: none; }
      body.nlws-print-a #nlws-q { display: none; }
    }
  </style>
</head>
<body>
  <div class="nlws-bar">
    <a href="../numbers-lab.html">← Numbers Lab</a>
    <button class="primary" onclick="NLAB_WS.printQuestions()">🖨️ Print questions</button>
    <button onclick="NLAB_WS.printAnswers()">🗝️ Print answer key</button>
    <button onclick="location.reload()">🔄 New questions</button>
    <span class="sp"></span>
  </div>
  <div id="nlws-host"></div>

  <script src="../js/nlab/worksheet.js"></script>
  <script>NLAB_WS.build(document.getElementById('nlws-host'), {});</script>
</body>
</html>
