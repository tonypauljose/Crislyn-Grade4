      color: #23222A; text-decoration: none; display: flex; align-items: center; gap: 8px;
      min-height: 44px;
    }
    .mq-brand i {
      width: 18px; height: 18px; border-radius: 5px; display: block;
      background: linear-gradient(135deg, #E4572E 50%, #0E8C7F 50%);
    }
    .mq-navlinks { display: flex; gap: 4px; flex-wrap: wrap; }
    .mq-navlinks a {
      font-family: 'Jost', sans-serif; font-size: .92rem; color: #5D5B69; text-decoration: none;
      padding: 10px 14px; border-radius: 999px; min-height: 44px; display: inline-flex; align-items: center;

    .mq-navlinks a:hover { background: #F6F2EC; color: #23222A; }
    .mq-navlinks a.is-here { background: #23222A; color: #fff; }
    .mq-foot-site {
      max-width: 960px; margin: 0 auto; padding: 28px 16px 40px; text-align: center;
      font-family: 'Jost', sans-serif; color: #8A8694; font-size: .88rem;
    }
    .mq-noscript {
      max-width: 620px; margin: 60px auto; padding: 24px; border: 2px dashed #E4572E;
      border-radius: 16px; font-family: 'Jost', sans-serif; text-align: center;
    }
    @media print { .mq-nav, .mq-foot-site { display: none; } }
  </style>

<script>
  (function () {
    'use strict';
    if (window.MQUI) window.MQUI.boot('mq-app');

    /* Offline support. The worker is NETWORK-FIRST on purpose: this site is
       updated by hand and viewed on a tablet that caches hard, so a
       cache-first worker would be a way to serve her yesterday's lesson. It
       only ever answers from the cache when the network has actually failed,
       and it ignores every request that is not part of MeasureQuest. */
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('mq-sw.js').catch(function () { /* offline is a bonus, not a requirement */ });
      });
    }
  })();
</script>
